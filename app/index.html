];

let musicCtx = null;
let musicTimer = null;
let musicNoteIndex = 0;
let musicGainNode = null;

function getSavedMusicTrack(){ try{ return localStorage.getItem(MUSIC_TRACK_KEY) || null; }catch(e){ return null; } }
function getSavedMusicVolume(){ try{ const v = parseFloat(localStorage.getItem(MUSIC_VOL_KEY)); return isNaN(v) ? 0.4 : v; }catch(e){ return 0.4; } }

function stopMusic(){
  if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
  if(musicCtx){ try{ musicCtx.close(); }catch(e){} musicCtx=null; }
  State.musicPlaying = false;
}

function playMusic(trackId){
  const track = MUSIC_TRACKS.find(t=>t.id===trackId);
  if(!track) return;
  stopMusic();
  try{
    musicCtx = new (window.AudioContext||window.webkitAudioContext)();
    musicGainNode = musicCtx.createGain();
    musicGainNode.gain.value = State.musicVolume;
    musicGainNode.connect(musicCtx.destination);
    musicNoteIndex = 0;
    const playNote = ()=>{
      if(!musicCtx) return;
      const freq = track.notes[musicNoteIndex % track.notes.length];
      const osc = musicCtx.createOscillator();
      const noteGain = musicCtx.createGain();
      osc.type = track.wave;
      osc.frequency.value = freq;
      const now = musicCtx.currentTime;
      const dur = track.tempo/1000;
      noteGain.gain.setValueAtTime(0.0001, now);
      noteGain.gain.linearRampToValueAtTime(0.85, now+0.06);
      noteGain.gain.exponentialRampToValueAtTime(0.0001, now+dur*0.95);
      osc.connect(noteGain);
      noteGain.connect(musicGainNode);
      osc.start(now);
      osc.stop(now+dur);
      musicNoteIndex++;
    };
    playNote();
    musicTimer = setInterval(playNote, track.tempo);
    State.musicPlaying = true;
    State.currentTrackId = trackId;
    try{ localStorage.setItem(MUSIC_TRACK_KEY, trackId); }catch(e){}
  }catch(e){
    toast('Browser ini tidak mendukung pemutaran musik','⚠️');
  }
}

function toggleMusic(trackId){
  if(State.musicPlaying && State.currentTrackId===trackId){ stopMusic(); }
  else{ playMusic(trackId); }
  render();
}

function setMusicVolume(v){
  State.musicVolume = parseFloat(v);
  if(musicGainNode) musicGainNode.gain.value = State.musicVolume;
  try{ localStorage.setItem(MUSIC_VOL_KEY, String(State.musicVolume)); }catch(e){}
}

function renderUserManageRows(){
  const q = (State.userManageSearch||'').toLowerCase().trim();
  const me = State.currentUser;
  const list = users
    .filter(u2 => u2.username.toLowerCase() !== me.username.toLowerCase())
    .filter(u2 => !q || u2.username.toLowerCase().includes(q))
    .sort((a,b)=> a.role===b.role ? a.username.localeCompare(b.username) : (a.role==='admin'?-1:1));

  if(!list.length){
    return `<div class="empty-state"><span class="em">🗂️</span>Tidak ada pengguna lain yang cocok.</div>`;

  return list.map(u2=>{
    const k = u2.role==='admin' ? kantins.find(kk=>kk.id===u2.kantinId) : null;
    const roleLabel = u2.role==='admin' ? (u2.superAdmin?'Admin Utama':'Admin Kantin') : 'Buyer';

      <span class="ic">${u2.role==='admin' ? '🛠️' : '🧑'}</span>
      <span class="tx">

  const target = users.find(u2=>u2.username===username);
  if(!target) return;
  if(target.superAdmin){

    return;
  }
  const roleLabel = target.role==='admin' ? 'admin' : 'buyer';
  askConfirm({
    icon:'🗑️',

    message:`Akun ${roleLabel} <b>${username}</b> akan dihapus permanen${target.role==='admin'?', beserta kantin, menu, dan promo miliknya':''}. Tindakan ini tidak bisa dibatalkan.`,
    confirmLabel:'Ya, Hapus',
    danger:true,
    action:'deleteUserAccount',
    payload:[username]
  });
}

function deleteUserAccount(username){
  const target = users.find(u2=>u2.username===username);
  if(!target) return;

  users = users.filter(u2=>u2.username!==username);

  // Kalau yang dihapus admin kantin: kantinnya, menu, dan promo miliknya
  // ikut dibersihkan supaya tidak jadi kantin "yatim" tanpa pengelola.
  // Riwayat pesanan (orders) tetap disimpan sebagai catatan historis.
  if(target.role==='admin' && target.kantinId!=null){
    kantins = kantins.filter(k=>k.id!==target.kantinId);
    menuItems = menuItems.filter(m=>m.kantinId!==target.kantinId);
    promos = promos.filter(p=>p.kantinId!==target.kantinId);
  }

  saveData();
  render();
  const listEl = document.getElementById('userManageList');
  if(listEl){ listEl.innerHTML = renderUserManageRows(); }
  toast(`Akun "${username}" berhasil dihapus`,'🗑️');
}

function pakaiHadiah(id){
  const p = promos.find(x=>x.id===id);
  if(!p || !p.active){ toast('Promo sudah tidak berlaku','⚠️'); return; }
  if(State.selectedKantinId !== p.kantinId){
    State.selectedKantinId = p.kantinId;
    saveSession(State.currentUser, p.kantinId);
    State.cart = [];
  }
  // Promo langsung dipasang & langsung siap dipakai — buyer tidak perlu
  // ketik ulang kode di kolom promo.
  State.appliedPromo = p;
  State.promoCode = p.code;
  State.giftBoxOpen = false;
  if(State.cart.length){
    // Sudah ada pesanan di keranjang -> langsung ke halaman bayar, promo aktif.
    State.cartOpen = false;
    State.checkoutOpen = true;
    State.paymentMethod = State.paymentMethod || null;
    render();
    toast(`Promo "${p.code}" langsung dipakai — tinggal pilih pembayaran!`,'🎉');
  } else {
    // Keranjang masih kosong -> arahkan pilih menu dulu, promo sudah nempel.
    State.cartOpen = false;
    render();
    toast(`Promo "${p.code}" sudah aktif! Pilih menu dulu, nanti otomatis kepakai saat bayar.`,'🎁');
  }
}

function openAuth(type){
  State.authModal = type;
  State._authError = null;
  State.forgotStep = 1;
  render();
}
function closeAuth(){ State.authModal = null; render(); }
function setRegRole(r){ State._regRole = r; render(); }

function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if(!u || !p){ State._authError='Username dan password wajib diisi.'; render(); return; }
  const user = findUser(u);
  if(!user || user.password !== p){ State._authError='Username atau password salah.'; render(); return; }

  if(!user.devices) user.devices = [];
  const deviceId = getDeviceId();
  const known = user.devices.find(d=>d.id===deviceId);

  if(known){
    known.lastActive = new Date().toISOString();
    saveData();
    finishLogin(user);
    return;
  }

  if(user.devices.length===0){
    // Login pertama kali untuk akun ini di perangkat manapun —
    // perangkat ini otomatis dijadikan Perangkat Utama.
    user.devices.push({id:deviceId, name:getDeviceName(), addedAt:new Date().toISOString(), isPrimary:true});
    saveData();
    finishLogin(user);
    toast('Perangkat ini dijadikan Perangkat Utama akun ini 🔐','🔐');
    return;
  }

  // Perangkat baru & belum dipercaya -> wajib izin dari Perangkat Utama.
  deviceRequests = (deviceRequests||[]).filter(r=>
    !(r.username.toLowerCase()===user.username.toLowerCase() && r.deviceId===deviceId));
  const reqId = nextId();
  deviceRequests.push({
    id: reqId, username: user.username, deviceId, deviceName: getDeviceName(),
    requestedAt: new Date().toISOString(), status: 'pending'
  });
  saveData();
  State.authModal = null;
  State._authError = null;
  State._pendingDeviceRequestId = reqId;
  State._pendingDeviceUsername = user.username;
  State.view = 'device-wait';
  render();
}

function finishLogin(user){
  State.currentUser = user;
  State.authModal = null;
  State.view = user.role==='admin' ? 'admin' : 'buyer';
  State.selectedKantinId = null;
  saveSession(user, null);
  render();
  toast(`Selamat datang, ${user.username}!`,'👋');
}

function cancelDeviceRequest(){
  if(State._pendingDeviceRequestId){
    deviceRequests = (deviceRequests||[]).filter(r=>r.id!==State._pendingDeviceRequestId);
    saveData();
  }
  State._pendingDeviceRequestId = null;
  State._pendingDeviceUsername = null;
  State.view = 'landing';
  State.authModal = 'login';
  render();
}

function doRegister(){
  const u = document.getElementById('regUser').value.trim();
  const p = document.getElementById('regPass').value;
  const p2 = document.getElementById('regPass2').value;
  const role = State._regRole || 'buyer';
  const kantinName = role==='admin' ? document.getElementById('regKantinName').value.trim() : '';
  const adminCode = role==='admin' ? document.getElementById('regAdminCode').value.trim() : '';
  if(u.length<3){ State._authError='Username minimal 3 karakter.'; render(); return; }
  if(p.length<3){ State._authError='Password minimal 3 karakter.'; render(); return; }
  if(p!==p2){ State._authError='Konfirmasi password tidak cocok.'; render(); return; }
  if(findUser(u)){ State._authError='Username sudah dipakai, pilih yang lain.'; render(); return; }
  if(role==='admin' && kantinName.length<3){ State._authError='Nama kantin/server minimal 3 karakter.'; render(); return; }
  if(role==='admin' && adminCode.toUpperCase()!==String(adminInviteCode).toUpperCase()){ State._authError='Kode admin salah. Minta kode ke Admin Utama.'; render(); return; }

  const newUser = {username:u, password:p, role};
  if(role==='admin'){
    const newKantin = {id:nextId(), name:kantinName, emoji:'🍽️', ownerUsername:u, ratings:[]};
    kantins.push(newKantin);
    newUser.kantinId = newKantin.id;
  }
  users.push(newUser);
  saveData();
  State.authModal = 'login';
  State._authError = null;
  render();
  toast(role==='admin' ? `Akun & kantin "${kantinName}" berhasil dibuat.` : 'Akun berhasil dibuat, silakan masuk.', '🎉');
}

function doForgotCheck(){
  const u = document.getElementById('forgotUser').value.trim();
  if(!findUser(u)){ State._authError='Username tidak ditemukan.'; render(); return; }
  State._forgotUsername = u;
  State.forgotStep = 2;
  State._authError = null;
  render();
}

function doForgotReset(){
  const p = document.getElementById('newPass').value;
  const p2 = document.getElementById('newPass2').value;
  if(p.length<3){ State._authError='Password minimal 3 karakter.'; render(); return; }
  if(p!==p2){ State._authError='Konfirmasi password tidak cocok.'; render(); return; }
  const user = findUser(State._forgotUsername);
  user.password = p;
  saveData();
  State.authModal='login';
  State._authError=null;
  render();
  toast('Password berhasil direset, silakan masuk.','🔐');
}

  State.currentUser=null;

/* =========================================================
   PESANAN SELESAI & RATING KANTIN (buyer)
========================================================= */
function kantinRatingSummary(kantinId){
  const k = kantins.find(x=>x.id===kantinId);
  const list = (k && k.ratings) || [];
  if(!list.length) return {avg:0, count:0};
  const sum = list.reduce((s,r)=>s+r.stars,0);
  return {avg: sum/list.length, count: list.length};
}

function myKantinRating(kantinId){
  const k = kantins.find(x=>x.id===kantinId);
  if(!k || !k.ratings) return null;
  const uname = State.currentUser.username.toLowerCase();
  return k.ratings.find(r=>r.username.toLowerCase()===uname) || null;
}

function openPesananSelesai(){
  const existing = myKantinRating(State.selectedKantinId);
  State.ratingStars = existing ? existing.stars : 0;
  State.pesananSelesaiOpen = true;
  render();
}
function closePesananSelesai(){ State.pesananSelesaiOpen=false; render(); }

function setRatingStars(n){ State.ratingStars = n; render(); }

function submitKantinRating(){
  if(!State.ratingStars){ toast('Pilih jumlah bintang dulu','⚠️'); return; }
  const k = kantins.find(x=>x.id===State.selectedKantinId);
  if(!k) return;
  if(!k.ratings) k.ratings=[];
  const uname = State.currentUser.username;
  const commentEl = document.getElementById('ratingComment');
  const comment = commentEl ? commentEl.value.trim() : '';
  const idx = k.ratings.findIndex(r=>r.username.toLowerCase()===uname.toLowerCase());
  const entry = {username:uname, stars:State.ratingStars, comment, date:new Date().toLocaleString('id-ID')};
  if(idx>=0) k.ratings[idx]=entry; else k.ratings.push(entry);
  saveData();
  render();
  toast('Terima kasih atas rating kamu!','⭐');
}

function changeQty(id, delta){
  const item = menuItems.find(m=>m.id===id);
  let entry = State.cart.find(c=>c.id===id);
  if(!entry && delta>0){
    if(item.stock<1){ toast('Stok habis!','⚠️'); return; }
    State.cart.push({id,qty:1});
    toast(`${item.name} ditambahkan ke keranjang`,'🛒');
  } else if(entry){
    const newQty = entry.qty + delta;
    if(newQty > item.stock){ toast('Melebihi stok tersedia!','⚠️'); return; }
    if(newQty<=0){ State.cart = State.cart.filter(c=>c.id!==id); }
    else entry.qty = newQty;
  }
  render();
}

function getDiscountAmount(subtotal){
  if(!State.appliedPromo) return 0;
  const p = State.appliedPromo;
  if(p.type==='persen') return Math.round(subtotal * p.value/100);
  return Math.min(p.value, subtotal);
}

function applyPromo(){
  const code = document.getElementById('promoInput').value.trim();
  if(!code){ State.promoError='Masukkan kode promo terlebih dahulu.'; render(); return; }
  const uname = (State.currentUser.username||'').toLowerCase();
  const promo = promos.find(p=>p.code.toLowerCase()===code.toLowerCase() && p.active && p.kantinId===State.selectedKantinId && (!p.assignedTo || p.assignedTo.toLowerCase()===uname));
  if(!promo){ State.promoError='Kode promo tidak valid atau sudah tidak aktif.'; State.appliedPromo=null; render(); return; }
  State.appliedPromo = promo;
  State.promoError = null;
  render();
  toast(`Promo ${promo.code} berhasil diterapkan!`,'🎉');
}

async function confirmPayment(){
  if(!State.paymentMethod) return;
  const subtotalForWallet = cartTotal();
  const discountForWallet = getDiscountAmount(subtotalForWallet);
  const finalTotalForWallet = Math.max(subtotalForWallet - discountForWallet, 0);
  // Kalau metode bayarnya e-wallet (DANA/GoPay/ShopeePay): salin nominal
  // otomatis & coba buka aplikasinya, supaya pembeli tinggal tempel & kirim.
  if(walletApps[State.paymentMethod]){
    await openWalletAppAndCopy(State.paymentMethod, finalTotalForWallet);
  }
  const items = State.cart.map(c=>{
    const item = menuItems.find(m=>m.id===c.id);
    item.stock -= c.qty;
    return {name:item.name, emoji:item.emoji, qty:c.qty, price:item.price};
  });
  const subtotal = cartTotal();
  const discount = getDiscountAmount(subtotal);
  const finalTotal = Math.max(subtotal - discount, 0);
  const methodInfo = paymentOptions.find(p=>p.id===State.paymentMethod);
  const order = {
    id: ++orderCounter,
    kantinId: State.selectedKantinId,
    buyer: State.currentUser.username,
    items,
    subtotal,
    discount,
    promoCode: State.appliedPromo ? State.appliedPromo.code : null,
    total: finalTotal,
    payment: methodInfo.label,
    paymentNumber: methodInfo.number || null,
    status: 'Menunggu',
    date: new Date().toLocaleString('id-ID'),
    cashReceived: null,
    change: null,
  };
  orders.unshift(order);
  saveData();
  State.cart=[];
  State.checkoutOpen=false;
  State.appliedPromo=null;
  State.promoCode='';
  State.receiptOrder=order;
  render();
}

/* ---------- Kembalian Uang (Tunai) ---------- */
function openKembalian(id){
  State.kembalianOrderId = id;
  State.kembalianResult = null;
  render();
}
function closeKembalian(){ State.kembalianOrderId=null; State.kembalianResult=null; render(); }

function hitungKembalian(){
  const order = orders.find(o=>o.id===State.kembalianOrderId);
  const received = parseInt(document.getElementById('cashReceivedInput').value) || 0;
  if(received < order.total){ toast('Uang diterima kurang dari total belanja','⚠️'); return; }
  State.kembalianResult = { received, change: received - order.total };
  render();
}

function simpanKembalian(){
  const order = orders.find(o=>o.id===State.kembalianOrderId);
  if(!State.kembalianResult){ toast('Hitung kembalian terlebih dahulu','⚠️'); return; }
  order.cashReceived = State.kembalianResult.received;
  order.change = State.kembalianResult.change;
  saveData();
  State.kembalianOrderId = null;
  State.kembalianResult = null;
  render();
  toast('Kembalian tersimpan pada pesanan','✅');
}

function renderKembalianModal(){
  const order = orders.find(o=>o.id===State.kembalianOrderId);
  const result = State.kembalianResult;
  return `

      <button class="modal-close" onclick="closeKembalian()">✕</button>

      <button class="btn btn-line btn-block" onclick="hitungKembalian()">Hitung Kembalian</button>

}

/* ---------- Riwayat Pembayaran ---------- */
function renderAdminRiwayat(){
  const filterMethod = State.riwayatFilter || 'semua';
  const q = (State.riwayatSearch||'').toLowerCase();

  const myOrders = orders.filter(o=>o.kantinId===State.currentUser.kantinId);

  let list = myOrders.filter(o=>{
    const matchMethod = filterMethod==='semua' || o.payment===filterMethod;
    const matchSearch = !q || o.buyer.toLowerCase().includes(q) || String(o.id).includes(q);
    return matchMethod && matchSearch;
  });

  const totalPendapatan = myOrders.filter(o=>o.status!=='Dibatalkan').reduce((s,o)=>s+o.total,0);
  const totalTransaksi = myOrders.length;
  const methodCount = {};
  myOrders.forEach(o=>{ methodCount[o.payment]=(methodCount[o.payment]||0)+1; });
  const favMethod = Object.keys(methodCount).sort((a,b)=>methodCount[b]-methodCount[a])[0] || '-';

  const methodChips = ['semua', ...paymentOptions.map(p=>p.label)].map(m=>`
    <button class="chip ${filterMethod===m?'active':''}" onclick="setRiwayatFilter('${m}')">${m==='semua'?'Semua Metode':m}</button>

  const cards = list.length ? list.map((o,i)=>`
    <div class="order-card" style="animation-delay:${Math.min(i,10)*0.03}s;">
      <div class="order-card-head">
        <div>
          <span class="order-card-id">#${o.id}</span>
          <div class="order-card-buyer">🧑 ${o.buyer}</div>
        </div>
        <span class="status-badge status-${o.status}"><span class="dot"></span>${statusLabels[o.status]||o.status}</span>
      </div>
      <div class="order-card-items">🍽️ ${o.items.map(i2=>`${i2.name} <b>x${i2.qty}</b>`).join(' &nbsp;·&nbsp; ')}</div>
      <div class="order-card-meta">
        <span>🗓️ ${o.date}</span>
        <span>${paymentIcon(o.payment)} ${o.payment}</span>
        ${o.promoCode?`<span>🎁 Promo: <b>${o.promoCode}</b></span>`:''}
        ${o.payment==='Tunai' && o.change!=null ? `<span>💵 Kembalian: <b>${formatRp(o.change)}</b></span>`:''}
      </div>
      <div class="order-card-foot" style="border-top:1px dashed var(--line);">
        <span class="muted">Total Transaksi</span>
        <span class="mono" style="font-weight:700;font-size:15px;color:var(--teal-deep);">${formatRp(o.total)}</span>
      </div>
    </div>`).join('') : `<div class="empty-state"><span class="em">💳</span>Tidak ada transaksi yang cocok.</div>`;

  return `
  <div class="section-head"><h2>Riwayat Pembayaran</h2><span class="muted">${totalTransaksi} total transaksi</span></div>

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:22px;">
    <div class="food-card riwayat-stat" style="align-items:flex-start;">
      <span class="muted">💰 Total Pendapatan</span>
      <p class="food-name mono" style="font-size:19px;color:var(--teal-deep);">${formatRp(totalPendapatan)}</p>
    </div>
    <div class="food-card riwayat-stat" style="align-items:flex-start;">
      <span class="muted">🧾 Jumlah Transaksi</span>
      <p class="food-name mono" style="font-size:19px;">${totalTransaksi}</p>
    </div>
    <div class="food-card riwayat-stat" style="align-items:flex-start;">
      <span class="muted">⭐ Metode Terpopuler</span>
      <p class="food-name" style="font-size:19px;color:var(--orange-deep);">${favMethod}</p>
    </div>
  </div>

  <div class="nav-search" style="max-width:320px;margin-bottom:14px;background:var(--card);border:1.5px solid var(--line);">
    <span>🔎</span>
    <input style="color:var(--ink);" type="text" placeholder="Cari buyer atau ID pesanan..." value="${State.riwayatSearch||''}" oninput="onRiwayatSearch(this.value)">

  <div class="chip-row" style="flex-wrap:wrap;overflow-x:visible;">${methodChips}</div>

  <div class="order-list">${cards}</div>`;

function onRiwayatSearch(v){

function savePromo(){
  const code = document.getElementById('pCode').value.trim().toUpperCase();
  const type = document.getElementById('pType').value;
  const value = parseInt(document.getElementById('pValue').value) || 0;
  const desc = document.getElementById('pDesc').value.trim();
  const assignedToRaw = document.getElementById('pAssignedTo').value.trim();
  const assignedTo = assignedToRaw ? assignedToRaw.replace(/^@/,'') : null;

  if(!code || value<=0){ toast('Kode dan nilai diskon wajib diisi dengan benar','⚠️'); return; }
  if(assignedTo && !users.find(u=>u.role==='buyer' && u.username.toLowerCase()===assignedTo.toLowerCase())){
    toast('Username buyer tujuan tidak ditemukan','⚠️'); return;
  }

  if(State.editingPromoId){
    const p = promos.find(x=>x.id===State.editingPromoId);
    Object.assign(p,{code,type,value,desc,assignedTo});
    toast('Promo berhasil diperbarui','✅');
  } else {
    if(promos.find(p=>p.kantinId===State.currentUser.kantinId && p.code.toLowerCase()===code.toLowerCase())){ toast('Kode promo sudah dipakai di kantinmu','⚠️'); return; }
    promos.push({id:nextId(),code,type,value,desc,active:true,kantinId:State.currentUser.kantinId,assignedTo});
    toast(assignedTo ? `Hadiah promo terkirim ke @${assignedTo}!` : 'Promo baru berhasil ditambahkan','🎉');
  }
  saveData();
  State.promoFormOpen=false;
  render();
}

  const myBuyers = [...new Set(orders.filter(o=>o.kantinId===State.currentUser.kantinId).map(o=>o.buyer))];

function sendGiftToBuyer(){
  const buyer = document.getElementById('gBuyer').value.trim();
  const type = document.getElementById('gType').value;
  const value = parseInt(document.getElementById('gValue').value) || 0;
  const desc = document.getElementById('gDesc').value.trim() || 'Hadiah spesial dari admin';

  if(!buyer){ toast('Pilih buyer tujuan dulu','⚠️'); return; }
  if(!users.find(u=>u.role==='buyer' && u.username.toLowerCase()===buyer.toLowerCase())){
    toast('Username buyer tidak ditemukan','⚠️'); return;
  }
  if(value<=0){ toast('Nilai hadiah wajib diisi dengan benar','⚠️'); return; }

  const code = 'GIFT' + genInviteCode();
  promos.push({id:nextId(),code,type,value,desc,active:true,kantinId:State.currentUser.kantinId,assignedTo:buyer});
  saveData();
  State.giftSendOpen=false;
  render();
  toast(`Hadiah berhasil dikirim ke @${buyer}! 🎁`,'🎉');
}

/* =========================================================
   GIFT ENERGI (admin) — kalau limit kesalahan Quiz Diskon
   buyer sudah habis (4x salah), admin bisa kirim ⚡ Energi
   supaya buyer dapat tambahan kesempatan menjawab lagi.
========================================================= */
function openGiftEnergy(){ State.giftEnergyOpen=true; render(); }
function closeGiftEnergy(){ State.giftEnergyOpen=false; render(); }

function renderGiftEnergyModal(){
  const myBuyers = [...new Set(orders.filter(o=>o.kantinId===State.currentUser.kantinId).map(o=>o.buyer))];
  const allBuyers = users.filter(u=>u.role==='buyer').map(u=>u.username);
  return `
  <div class="overlay" onclick="if(event.target===this) closeGiftEnergy()">
    <div class="modal">
      <button class="modal-close" onclick="closeGiftEnergy()">✕</button>
      <h2>⚡ Gift Energi</h2>
      <p class="sub">Kirim energi supaya limit kesalahan Quiz Diskon buyer bertambah & kuisnya terbuka lagi.</p>
      <div class="field">
        <label>Buyer Tujuan</label>
        <input id="eBuyer" type="text" list="energyBuyerList" placeholder="Ketik username buyer">
        <datalist id="energyBuyerList">
          ${(myBuyers.length?myBuyers:allBuyers).map(b=>`<option value="${b}"></option>`).join('')}
        </datalist>
      </div>
      <div class="field"><label>Jumlah Energi (⚡ = tambahan kesempatan salah)</label><input id="eAmount" type="number" min="1" value="4" placeholder="Contoh: 4"></div>
      <button class="btn btn-primary btn-block" onclick="sendEnergyToBuyer()">Kirim Energi</button>
    </div>
  </div>`;
}

function sendEnergyToBuyer(){
  const buyer = document.getElementById('eBuyer').value.trim();
  const amount = parseInt(document.getElementById('eAmount').value) || 0;

  if(!buyer){ toast('Pilih buyer tujuan dulu','⚠️'); return; }
  const target = users.find(u=>u.role==='buyer' && u.username.toLowerCase()===buyer.toLowerCase());
  if(!target){ toast('Username buyer tidak ditemukan','⚠️'); return; }
  if(amount<=0){ toast('Jumlah energi wajib diisi dengan benar','⚠️'); return; }

  ensureQuizProfile(target);
  target.quizMistakeLimit += amount;
  target.quizEnergyReceived = (target.quizEnergyReceived||0) + amount;
  saveData();
  State.giftEnergyOpen=false;
  render();
  toast(`${amount} energi berhasil dikirim ke @${buyer}! ⚡`,'🎉');
}

/* =========================================================
   INIT
========================================================= */
applyTheme(getSavedTheme());
State.musicVolume = getSavedMusicVolume();
State.currentTrackId = getSavedMusicTrack();
initApp();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
